<button
  class="dga-button"
  [class.dga-button--primary]="variant === 'primary'"
  [class.dga-button--secondary]="variant === 'secondary'"
  [class.dga-button--outline]="variant === 'outline'"
  [class.dga-button--ghost]="variant === 'ghost'"
  [class.dga-button--destructive]="variant === 'destructive'"
  [class.dga-button--link]="variant === 'link'"
  [class.dga-button--black]="variant === 'black'"
  [class.dga-button--destructive-outline]="variant === 'destructive-outline'"
  [class.dga-button--destructive-subtle]="variant === 'destructive-subtle'"
  [class.dga-button--destructive-ghost]="variant === 'destructive-ghost'"
  [class.dga-button--full-width]="fullWidth"
  [class.dga-button--on-color]="onColor"
  [class.dga-button--sm]="size === 'sm'"
  [class.dga-button--md]="size === 'md'"
  [class.dga-button--lg]="size === 'lg'"
  [class.dga-button--icon]="size === 'icon'"
  [class.dga-button--icon-md]="size === 'icon-md'"
  [class.dga-button--icon-sm]="size === 'icon-sm'"
  [class.dga-button--icon-xs]="size === 'icon-xs'"
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading"
  (click)="handleClick($event)"
>
  @if (loading) {
    <span class="dga-button__spinner" aria-hidden="true"></span>
  }
  @if (startIcon && !loading) {
    <span class="dga-button__icon"><dga-icon [name]="startIcon" /></span>
  }
  <span class="dga-button__content">
    <ng-content></ng-content>
  </span>
  @if (endIcon && !loading) {
    <span class="dga-button__icon"><dga-icon [name]="endIcon" /></span>
  }
</button>
